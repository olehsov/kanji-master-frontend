server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Hashed bundles (outputHashing: all) can be cached forever.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed static assets (kanji SVGs, images, fonts).
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback: every unknown path is handled by the Angular router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
