<div [formGroup]="form" class="kanji-filter">
  <h2 class="section-header">Канджі</h2>

  <mat-form-field>
    <mat-label>Японська та Ромаджі</mat-label>
    <input formControlName="search" matInput placeholder="hito or 人" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Рівень</mat-label>
    <mat-select [multiple]="true" formControlName="grade">
      @for (grade of grades; track grade) {
        <mat-option [value]="grade">{{ grade }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-chip-listbox
    class="kanji-attributes"
    [multiple]="true"
    formControlName="jlpt"
    aria-label="Рівень JLPT"
  >
    @for (jlptOption of jlpt; track jlptOption.value) {
      <mat-chip-option [value]="jlptOption.label">{{
        jlptOption.value
      }}</mat-chip-option>
    }
  </mat-chip-listbox>
</div>

<section class="kanji-container">
  @for (item of kanjies(); track item.kanji) {
    <a class="kanji-card" lang="ja" [routerLink]="['/kanji', item.kanji]">
      {{ item.kanji }}
    </a>
  }

  @if (loading()) {
    <mat-progress-bar class="page-progress" mode="indeterminate" />
  }
  @if (error()) {
    <p class="load-error" role="alert">
      Не вдалося завантажити канджі.
      <button type="button" (click)="loadFirstPage()">Спробувати ще раз</button>
    </p>
  }
</section>
